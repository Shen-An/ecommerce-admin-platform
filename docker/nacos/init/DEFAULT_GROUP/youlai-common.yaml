  password: null

mysql:
  host: localhost
  port: 3306
  username: root
  password: 123456

rabbitmq:
  host: localhost
  port: 5672
  username: admin
  password: admin


# 验签公钥地址
spring:
  security:
    oauth2:
      authorizationserver:
        token-uri: ${gateway.endpoint}/youlai-auth/oauth2/token
      resourceserver:
        jwt: 
          jwk-set-uri: ${gateway.endpoint}/youlai-auth/oauth2/jwks

# 网关地址
gateway:
  endpoint: http://localhost:9999

# Nacos 配置中心地址(Seata RM、TM 注册)
nacos:
  server-addr: http://localhost:8848

